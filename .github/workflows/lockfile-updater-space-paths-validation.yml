name: Validate lockfile updater paths with spaces
on:
  push:
    branches: [test/lockfile-updater-space-paths-validation]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20
      - name: Prepare Bazel and check BUILD formatting
        shell: bash
        run: |
          version=$(cat .bazelversion)
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          curl --fail --location --retry 3 "https://github.com/bazelbuild/bazel/releases/download/${version}/bazel-${version}-${os}-${arch}" -o "$RUNNER_TEMP/bazel"
          chmod +x "$RUNNER_TEMP/bazel"
          "$RUNNER_TEMP/bazel" --version
          if [[ "$arch" == x86_64 ]]; then arch=amd64; fi
          curl --fail --location --retry 3 "https://github.com/bazelbuild/buildtools/releases/download/v10.0.1/buildifier-${os}-${arch}" -o "$RUNNER_TEMP/buildifier"
          chmod +x "$RUNNER_TEMP/buildifier"
          "$RUNNER_TEMP/buildifier" -mode=check src/test/tools/bzlmod/BUILD
      - name: Reproduce failures with the original updater
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tmp probe"
          probe_dir=$(TMPDIR="$RUNNER_TEMP/tmp probe" mktemp -d -t bazel.XXXXXX)
          printf 'Native mktemp path: <%s>\n' "$probe_dir"
          rmdir "$probe_dir"
          git show 1de6bcf1f38beb297e8d45f7bf10df3a2761927b:src/test/tools/bzlmod/update_default_lock_file.sh > src/test/tools/bzlmod/update_default_lock_file.sh
          set +e
          "$RUNNER_TEMP/bazel" --batch test --jobs=2 --test_output=all //src/test/tools/bzlmod:update_default_lock_file_test
          status=$?
          set -e
          test "$status" -eq 3
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = 'bazel-testlogs/src/test/tools/bzlmod/update_default_lock_file_test/test.xml'
          cases = ET.parse(path).findall('.//testcase')
          results = {c.attrib['name']: c.find('failure') is not None or c.find('error') is not None for c in cases}
          print('Original updater failures:', results)
          expected = {'test_plain_paths': False, 'test_runfiles_path_with_spaces': True, 'test_workspace_path_with_spaces': True, 'test_temporary_path_with_spaces': True, 'test_all_paths_with_spaces': True, 'test_bazel_failure_preserves_lockfile': False}
          assert results == expected, (results, expected)
          PY
      - name: Verify the fixed updater
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git checkout HEAD -- src/test/tools/bzlmod/update_default_lock_file.sh
          bash -n src/test/tools/bzlmod/update_default_lock_file.sh
          bash -n src/test/tools/bzlmod/update_default_lock_file_test.sh
          git diff --check 1de6bcf1f38beb297e8d45f7bf10df3a2761927b HEAD -- src/test/tools/bzlmod
          "$RUNNER_TEMP/bazel" --batch test --jobs=2 --test_output=all //src/test/tools/bzlmod:update_default_lock_file_test
